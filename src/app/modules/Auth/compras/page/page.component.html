<div class="flex flex-col gap-4">
  <div class="flex items-center justify-center pt-5">
    <h3 class="text-4xl font-bold">Historial de Compras</h3>
  </div>
  <p-table [paginator]="items.length >= 5 ? true : false" size="small" [rows]="5" [value]="items" class="w-full pl-2">
    <ng-template pTemplate="header">
      <tr class="text-center">
        <th>Imagen</th>
        <th>Nombre</th>
        <th>Unidades</th>
        <th>Precio</th>
        <th>Fecha de Compra</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template let-rowData let-i="rowIndex" pTemplate="body" class="text-center">
      <tr class="hover:bg-gray-100 transition-all duration-300">
        <td><img class="w-[5rem]" [src]="rowData.imagen_url" alt="carrito-img"></td>
        <td>{{ rowData.nombre }}</td>
        <td>{{ rowData.cantidad }}</td>
        <td>{{ rowData.precio | currency }}</td>
        <td>{{ rowData.fecha_compra | date:'dd/MM/yyyy' }}</td>
        <td>{{ rowData.estado }}</td>
        <td>
          <div
            class="rounded-full border-2 border-cyan-900 w-8 h-8 flex items-center justify-center cursor-pointer hover:bg-gray-200 transition-all duration-300  ">
            <i class="pi pi-info" tabindex="0" role="button" (click)="showDrawer(i)" (keyup.enter)="showDrawer(i)"
              aria-label="Ver detalles de la compra"></i>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer (onHide)="hideDrawer()" [(visible)]="visible" [modal]="true" position="right" [style]="{width: '70vw'}"
  [baseZIndex]="10000" [closeOnEscape]="true">
  <router-outlet />
</p-drawer>
