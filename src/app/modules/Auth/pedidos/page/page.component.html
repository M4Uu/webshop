<div class="p-3">
  <div class="grid grid-cols-2">
    <div class="flex items-center justify-start my-5">
      <h3 class="text-4xl font-bold">Pedidos</h3>
    </div>
    <div class="flex items-center justify-end my-5">
      <p-button icon="pi pi-plus" label="Nuevo Pedido" class="p-button-success" (onClick)="createPedido()" />
    </div>
  </div>
</div>

<div class="p-3">
  <p-table [value]="pedidos" [paginator]="pedidos.length > 7" [rows]="7" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Id</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-pedido>
      <tr>
        <td>{{ pedido.id }}</td>
        <td>{{ pedido.fecha | date: 'short' }}</td>
        <td>{{ pedido.total | currency }}</td>
        <td>{{ pedido.estado }}</td>
        <td class="flex gap-3">
          <p-button (onClick)="showPedidoDetails(pedido)" ngClass="rounded-lg" icon="pi pi-eye" class="p-button-info" />
          <p-button (onClick)="deletePedido(pedido)" ngClass="rounded-lg" icon="pi pi-trash" class="p-button-danger" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="visible" [modal]="true" position="right" [style]="{width: '40vw'}" [baseZIndex]="10000"
  [closeOnEscape]="true">
  <app-form-pedidos [pedido]="pedido" />
</p-drawer>
