<div class="p-3">
  <div class="grid grid-cols-2">
    <div class="flex items-center justify-start my-5">
      <h3 class="text-4xl font-bold">Pedidos</h3>
    </div>
    <div class="flex items-center justify-end my-5">
      <p-button icon="pi pi-plus" label="Nuevo Pedido" class="p-button-success" (onClick)="createPedido()" />
    </div>
  </div>
</div>

<div class="p-3">
  <p-table [value]="pedidos" [paginator]="pedidos.length > 7" size="large" [rows]="8" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Fecha</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-pedido>
      <tr>
        <td>{{ pedido.id }}</td>
        <td>{{ pedido.nombre }}</td>
        <td>{{ pedido.estado }}</td>
        <td>{{ pedido.fecha_pedido | date: 'short' }}</td>
        <td class="">
          <i (click)="showPedidoDetails(pedido.id)" [tabindex]="0" (keyup.esc)="visible = false"
            ngClass="rounded-lg pi pi-eye" class="text-indigo-400 cursor-pointer"></i>
          <i (click)="deletePedido(pedido)" [tabindex]="0" (keyup.esc)="visible = false"
            ngClass="rounded-lg pi pi-trash" class="text-red-400 ml-4 cursor-pointer"></i>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer (onHide)="hideDrawer()" [(visible)]="visible" [modal]="true" position="right" [style]="{width: '40vw'}"
  [baseZIndex]="10000" [closeOnEscape]="true">
  <router-outlet />
</p-drawer>
