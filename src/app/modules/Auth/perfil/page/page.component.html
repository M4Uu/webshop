<div class="p-10">
  <div class="mb-2 flex flex-col gap-3">
    <h1 class="font-bold text-2xl">Perfil de Usuario</h1>
    <h3 class="font-bold text-xl">Datos del Perfil <i class="pi pi-pencil text-indigo-400 cursor-pointer" [tabindex]="0"
        (click)="changeEditar()" (keyup.esc)="editar"></i></h3>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <div class=" fluid flex flex-col gap-3">
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Nombres</label>
        <input [readOnly]="!editar" pInputText type="text" [(ngModel)]="user.nombres">
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Cédula de Identidad</label>
        <input [readOnly]="!editar" pInputText type="text" [(ngModel)]="user.cedula">
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Nombre de Usuario</label>
        <input [readOnly]="!editar" pInputText type="text" [(ngModel)]="user.nombre_usuario">
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Localidad</label>
        <input [readOnly]="!editar" pInputText type="text" [(ngModel)]="user.localidad">
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Correo</label>
        <input [readOnly]="!editar" pInputText type="text" [(ngModel)]="user.correo">
      </div>
    </div>
    <div class="w-full flex justify-center">
      <img class="w-[28rem]" [src]="user.imagen_url" alt="usuario-avatar">
    </div>
  </div>
  <div>
    <h3 class="font-bold text-xl">Datos Bancarios <i class="pi pi-pencil text-indigo-400 cursor-pointer" [tabindex]="0"
        (click)="changeEditarBank()" (keyup.esc)="editar"></i></h3>
  </div>
</div>
