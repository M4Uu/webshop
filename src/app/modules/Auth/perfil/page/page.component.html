<div class="p-10">
  <div class="mb-2 flex flex-col gap-3">
    <h1 data-aos="fade-down" class="font-bold text-2xl">Perfil de Usuario</h1>
    <h3 data-aos="fade-zoom-in" class="font-bold text-xl">Datos del Perfil
      <i *ngIf="!editar" class="pi pi-pencil text-indigo-400 cursor-pointer" [tabindex]="0" (click)="changeEditar()"
        (keyup.esc)="editar" pTooltip="Editar" tooltipPosition="top"></i>
      <i *ngIf="editar" class="pi pi-save text-green-400 cursor-pointer" [tabindex]="0" (click)="changeGuardar()"
        (keyup.esc)="editar" pTooltip="Guardar" tooltipPosition="top"></i>
    </h3>
  </div>
  <form data-aos="fade-zoom-in" [formGroup]="userForm" class="grid grid-cols-2 gap-3 mb-3">
    <div class=" fluid flex flex-col gap-3">
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Nombres</label>
        <input *ngIf="!loading" [readOnly]="!editar" pInputText type="text" formControlName="nombres">
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Nombre de Usuario</label>
        <input *ngIf="!loading" [readOnly]="!editar" pInputText type="text" formControlName="nombre_usuario">
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Localidad</label>
        <input *ngIf="!loading" [readOnly]="!editar" pInputText type="text" formControlName="localidad">
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Correo</label>
        <input *ngIf="!loading" [readOnly]="!editar" pInputText type="text" formControlName="correo">
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>
    </div>
    <div class="w-full flex justify-center">
      <p-fileupload #fileUpload name="image" [url]="getUploadImgUrl" [multiple]="false"
        accept="image/jpeg,image/png,image/jpg" maxFileSize="1000000" (onSelect)="onSelectedFiles($event)"
        (onUpload)="handleUploadResponse($event)">
        <ng-template #header let-files let-chooseCallback="chooseCallback" let-clearCallback="clearCallback">
          <div class="w-[23rem] bg-black rounded-lg">
            <img *ngIf="!loading" (click)="selectEvent(chooseCallback, clearCallback)" (keyup.esc)="editar"
              [tabindex]="0" class="hover:opacity-85 cursor-pointer" [src]="userForm?.value?.imagen_url"
              alt="usuario-avatar">
            <p-skeleton *ngIf="loading" height="23rem" styleClass="w-full" />
          </div>
        </ng-template>
      </p-fileupload>
    </div>
  </form>
  <div class="flex flex-col gap-3">
    <h3 data-aos="fade-zoom-in" class="font-bold text-xl">Datos Pago Móvil
      <i *ngIf="!editarMovil" class="pi pi-pencil text-indigo-400 cursor-pointer" [tabindex]="0"
        (click)="changeEditarMovil()" (keyup.esc)="editar" pTooltip="Editar" tooltipPosition="top"></i>
      <i *ngIf="editarMovil" class="pi pi-save text-green-400 cursor-pointer" [tabindex]="0"
        (click)="changeGuardarMovil()" (keyup.esc)="editar" pTooltip="Guardar" tooltipPosition="top"></i>
    </h3>
    <form data-aos="fade-zoom-in" [formGroup]="movilForm" class="fluid flex flex-col gap-3">
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Número de Teléfono</label>
        <input *ngIf="!loading" [readOnly]="!editarMovil" pInputText type="text" formControlName="telefono">
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />

        <small
          *ngIf="movilForm.get('telefono')?.invalid && (movilForm.get('telefono')?.touched || movilForm.get('telefono')?.dirty)"
          class="p-error">
          <div *ngIf="movilForm.get('telefono')?.errors?.['required']">El teléfono es obligatorio</div>
          <div *ngIf="movilForm.get('telefono')?.errors?.['telefonoLongitudMinima']">
            El teléfono debe tener al menos 10 dígitos
          </div>
          <div *ngIf="movilForm.get('telefono')?.errors?.['telefonoInvalido']">
            Formato inválido. Ejemplo válido: 04121234567
          </div>
        </small>
      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Cédula de Identidad</label>
        <p-inputnumber *ngIf="!loading" [min]="7000000" [max]="50000000" [readonly]="!editarMovil" mode="decimal"
          type="text" formControlName="cedula" />
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />

      </div>
      <div class="field flex flex-col gap-1">
        <label class="text-lg" for="">Banco</label>
        <p-select *ngIf="!loading" [readonly]="!editarMovil" [options]="banklist" filter="true"
          formControlName="banco_num" />
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />

      </div>
    </form>
  </div>
</div>
