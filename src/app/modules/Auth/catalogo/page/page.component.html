<div class="p-3">
  <div class="flex items-center justify-center my-5">
    <h3 data-aos="fade-down" data-aos-duration="800" class="text-4xl font-bold">Catálogo de Productos</h3>
  </div>

  <div class="grid grid-cols-12 gap-3 relative">
    @if(!loading){
    <div *ngFor="let item of items; let i = index" data-aos="flip-right" [attr.data-aos-delay]="100 * i"
      [tabindex]="item.id" (click)="showDrawer(item.id)" (keyup.esc)="visible = false"
      class="shadow-lg col-span-3 h-[19rem] rounded-md overflow-hidden transition-transform transform hover:scale-105 cursor-pointer">
      <div class="flex flex-col h-full w-full">
        <div class=" rounded-t flex flex-col justify-center items-center h-52 w-full">
          <div class="flex items-center justify-between w-full p-2 px-3">
            <p-rating [style]="{'--p-rating-icon-size': '13px'}" (ngModel)="calificacion(item)"
              [ngModel]="item.calificacion" [readonly]="true" />
            <div class="flex items-center gap-2">
              <i *ngIf="item.en_carrito" class="pi pi-shopping-cart"></i>
              <i *ngIf="!item.en_guardados" (click)="toggleGuardado(item, $event)" [tabindex]="i"
                (keyup.esc)="toggleGuardado(item, $event)" class="pi pi-bookmark"></i>
              <i *ngIf="item.en_guardados" (click)="toggleGuardado(item, $event)" [tabindex]="i"
                (keyup.esc)="toggleGuardado(item, $event)" class="pi pi-bookmark-fill"></i>
            </div>
          </div>
          <img [src]="item.imagen_url" alt="{{ item.nombre }}" class="w-full h-40 object-contain ">
        </div>
        <div class="grid grid-cols-12 text-gray-600 m-4">
          <div class="col-span-10">
            <h3 class="text-medium font-semibold">{{ item.nombre }}</h3>
            <p class="text-sm">{{ getTextUntilFirstDot(item.descripcion) }}.</p>
          </div>
          <div class="flex flex-col col-span-2 text-center">
            <span class="text-xs font-bold mt-2">{{ item.precio | currency }}</span>
            <span class="text-xs font-bold text-right">{{ item.categoria }}</span>
          </div>
        </div>
      </div>
    </div>
    }@else {
    <p-skeleton data-aos="flip-right" [attr.data-aos-delay]="100 * i"
      *ngFor="let item of [0,1,2,3,4,5,6,7]; let i = index" height="19rem" class="col-span-3" />
    }

    <div [tooltipDisabled]="visibleFilter" pTooltip="Filtros" tooltipPosition="top" data-aos="zoom-in-down" tabindex="0"
      (click)="!visibleFilter && (visibleFilter = true)" (keyup.esc)="visibleFilter = false"
      class="fixed z-50 top-24 right-5 flex items-center justify-center w-5 h-5 shadow-lg p-5 rounded-full bg-white cursor-pointer hover:scale-125 transition"
      [class]="visibleFilter ? 'filter-container r-container rounded-xl hover:transform-none cursor-auto' : ''">
      <i *ngIf="!visibleFilter" class="pi pi-filter text-xs"></i>
      <div class="h-full w-full flex gap-3" *ngIf="visibleFilter">
        <p-floatlabel class="w-full md:w-80" variant="on">
          <p-multiselect pTooltip="Filtrar por categorias" tooltipPosition="top" [(ngModel)]="selectCategoria"
            [options]="categorias" (onChange)="filterByCategory()" optionLabel="name" filter styleClass="w-full" />
          <label for="">Categorías</label>
        </p-floatlabel>
        <p-floatLabel variant="on">
          <input pTooltip="Filtrar por nombre" tooltipPosition="top" pInputText (change)="filterByName($event)" />
          <label class="text-sm" for="">Nombre</label>
        </p-floatLabel>
        <p-button pTooltip="Cerrar" tooltipPosition="top" (onClick)="visibleFilter = false; $event.stopPropagation()"
          icon="pi pi-times" />
      </div>
    </div>
  </div>
</div>


<p-drawer (onHide)="hideDrawer()" [(visible)]="visible" [modal]="true" position="right" [style]="{width: '27vw'}"
  [baseZIndex]="10000" [closeOnEscape]="true">
  <router-outlet />
</p-drawer>
