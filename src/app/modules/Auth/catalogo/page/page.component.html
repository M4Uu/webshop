<div class="p-3">
  <div class="grid grid-cols-12 gap-3 relative">
    @for (item of items; track $index) {
    <div [tabindex]="$index" (click)="showDrawer($index)" (keyup.esc)="visible = false"
      class="shadow-lg col-span-3 h-[21.3rem] rounded-md overflow-hidden transition-transform transform hover:scale-105 cursor-pointer">
      <div class="flex flex-col h-full w-full">
        <div class="bg-[#e9e9e9] rounded-t flex flex-col justify-center items-center h-52 w-full">
          <p-rating [style]="{'--p-rating-icon-size': '13px'}" class="pl-5 self-start" [(ngModel)]="value"
            [readonly]="true" />
          <img [src]="item.image" alt="{{ item.name }}" class="w-full h-40 object-contain ">
        </div>
        <div class="grid grid-cols-12 text-gray-600 m-4">
          <div class="col-span-10">
            <h3 class="text-medium font-semibold">{{ item.name }}</h3>
            <p class="text-sm">{{ item.description }}</p>
          </div>
          <div class="col-span-2 text-center">
            <span class="text-xs font-bold text-right">{{ item.category }}</span>
            <span class="text-xs font-bold mt-2">{{ item.price | currency }}</span>
          </div>
        </div>
      </div>
    </div>
    }
    <div tabindex="0" (click)="!visibleFilter && (visibleFilter = true)" (keyup.esc)="visibleFilter = false"
      class="absolute flex items-center justify-center w-5 h-5 shadow-lg p-5 rounded-full bg-white top-5 right-5 cursor-pointer hover:scale-125 transition"
      [class]="visibleFilter ? 'filter-container rounded-xl hover:scale-100 cursor-auto' : ''">
      <i *ngIf="!visibleFilter" class="pi pi-filter text-xs"></i>
      <div class="h-full w-full flex gap-3" *ngIf="visibleFilter">
        <p-floatlabel class="w-full md:w-80" variant="on">
          <p-multiselect [(ngModel)]="selectCategoria" [options]="categoria" optionLabel="name" filter
            styleClass="w-full" />
          <label for="">Categorías</label>
        </p-floatlabel>
        <p-floatLabel variant="on">
          <input pInputText>
          <label class="text-sm" for="">Nombre</label>
        </p-floatLabel>
        <p-button (onClick)="visibleFilter = false; $event.stopPropagation()" icon="pi pi-times" />
      </div>
    </div>
  </div>
</div>


<p-drawer (onHide)="hideDrawer()" [(visible)]="visible" [modal]="true" position="right" [style]="{width: '70vw'}"
  [baseZIndex]="10000" [closeOnEscape]="true">
  <router-outlet />
</p-drawer>
