<div class="p-3">
  <div class="grid grid-cols-4">
    <div class="col-span-3 flex items-center justify-center my-5">
      <h3 data-aos="fade-down" class="text-4xl font-bold">Gestión de Productos</h3>
    </div>
    <div class="col-span-1 flex items-center justify-end my-5">
      <p-button data-aos="zoom-out-down" data-aos-duration="1500" icon="pi pi-plus" label="Nuevo Producto"
        class="p-button-success" (onClick)="createPedido()" />
    </div>
  </div>
</div>

<div class="p-3">
  <p-table [loading]="loading" data-aos="fade-zoom-in" [value]="productos" [paginator]="productos.length > 7"
    size="large" [rows]="8" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Existencias</th>
        <th>Calificación</th>
        <th>Opciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-producto>
      <tr>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.precio | currency }}</td>
        <td>{{ producto.existencias }}</td>
        <td><p-rating class="cursor-default" [readonly]="true" [(ngModel)]="producto.calificacion" /></td>
        <td class="">
          <i (click)="showProductoDetails(producto.id)" [tabindex]="0" (keyup.esc)="visible = false"
            ngClass="rounded-lg pi pi-eye" class="text-indigo-400 cursor-pointer"></i>
          <i (click)="deletePedido(pedido)" [tabindex]="0" (keyup.esc)="visible = false"
            ngClass="rounded-lg pi pi-trash" class="text-red-400 ml-4 cursor-pointer"></i>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer (onHide)="hideDrawer()" [(visible)]="visible" [modal]="true" position="right" [style]="{width: '50vw'}"
  [baseZIndex]="10000" [closeOnEscape]="true">
  <router-outlet />
</p-drawer>
