<div class="p-3">
  <div class="grid grid-cols-4">
    <div class="col-span-4 flex items-center justify-center my-5">
      <h3 data-aos="fade-down" class="text-4xl font-bold">Gestión de Pedidos</h3>
    </div>
  </div>
</div>

<div class="p-3">
  <p-table [loading]="loading" data-aos="fade-zoom-in" [value]="pedidos" [paginator]="pedidos.length > 7" size="large"
    [rows]="8" [responsiveLayout]="'scroll'">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Estado</th>
        <th>Fecha cita</th>
        <th>Creado el</th>
        <th>Opciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-pedido>
      <tr>
        <td>{{ pedido.nombre }}</td>
        <td>{{ pedido.prioridad }}</td>
        <td *ngIf="pedido.fecha_cita !== 'Sin asignar'">{{ pedido.fecha_cita | date: 'short' }}</td>
        <td *ngIf="pedido.fecha_cita === 'Sin asignar'">{{ pedido.fecha_cita }}</td>
        <td>{{ pedido.fecha_creacion | date: 'dd:mm:yy' }}</td>
        <td class="">
          <i (click)="showPedidoDetails(pedido.id)" [tabindex]="0" (keyup.esc)="visible = false"
            ngClass="rounded-lg pi pi-eye" class="text-indigo-400 cursor-pointer"></i>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer (onHide)="hideDrawer()" [(visible)]="visible" [modal]="true" position="right" [style]="{width: '50vw'}"
  [baseZIndex]="10000" [closeOnEscape]="true">
  <router-outlet />
</p-drawer>
