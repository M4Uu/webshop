<div class="px-5">
  <div class="flex items-center justify-between mb-4">
    <h4 class="text-2xl font-bold">Detalle Pedido</h4>
  </div>

  <form [formGroup]="pedidoForm" (ngSubmit)="onSubmit()">
    <div class="p-fluid flex flex-col gap-4">
      <div class="field flex flex-col gap-2">
        <label for="nombre">Nombre del Pedido</label>
        <input *ngIf="!loading" [readonly]="true" pInputText id="nombre" formControlName="nombre" />
        <small *ngIf="pedidoForm.get('nombre')?.invalid && pedidoForm.get('nombre')?.touched" class="p-error">
          El nombre del pedido es requerido.
        </small>
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />

      </div>
      <div class="field flex flex-col gap-2">
        <label for="nombre">Descripción del Encargo</label>
        <textarea *ngIf="!loading" [readonly]="true" rows="5"
          class="border b  order-gray-300 hover:border-gray-400 rounded-lg" cols="30" pTextarea
          formControlName="descripcion"></textarea>
        <small *ngIf="pedidoForm.get('descripcion')?.invalid && pedidoForm.get('descripcion')?.touched" class="p-error">
          La descripcion del pedido es requerida.
        </small>
        <p-skeleton *ngIf="loading" height="9rem" styleClass="w-full" />
      </div>
      <div class="field flex flex-col gap-2">
        <label for="nombre">Cantidad</label>
        <p-inputnumber *ngIf="!loading" [readonly]="true" formControlName="cantidad" showButtons="true" inputId="minmax"
          mode="decimal" [min]="0" [max]="100" />
        <small *ngIf="pedidoForm.get('cantidad')?.invalid && pedidoForm.get('cantidad')?.touched" class="p-error">
          El cantidad del pedido es requerido.
        </small>
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />

      </div>
      <div class="field flex flex-col gap-2">
        <label for="nombre">Categoría</label>
        <p-select *ngIf="!loading" [readonly]="true" formControlName="categoria" [options]="categorias"
          optionLabel="name" placeholder="Seleccione una categoría" class="w-full" />
        <small *ngIf="pedidoForm.get('cantidad')?.invalid && pedidoForm.get('cantidad')?.touched" class="p-error">
          El cantidad del pedido es requerido.
        </small>
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>

      <div class="flex w-full mt-5 mb-2">
        <div class="relative bg-gray-400 h-[3px] w-full rounded-3xl">
          <span class="absolute px-3 top-[-13px] left-[2rem] bg-white text-lg">Datos por asignar</span>
        </div>
      </div>

      <div class="field flex flex-col gap-2">
        <label for="nombre">Estado del pedido</label>
        <p-select *ngIf="!loading" formControlName="prioridad" [options]="prioridad" optionLabel="name"
          placeholder="Seleccione un estado" class="w-full" />
        <small *ngIf="pedidoForm.get('prioridad')?.invalid && pedidoForm.get('prioridad')?.touched" class="p-error">
          El estado del pedido es requerido.
        </small>
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>

      <div class="field flex flex-col gap-2">
        <label for="nombre">Fecha de la cita</label>
        <p-datepicker [showTime]="true" hourFormat="12" [minDate]="minDate" *ngIf="!loading" styleClass="w-full"
          formControlName="fecha_cita" />
        <small *ngIf="pedidoForm.get('fecha_cita')?.invalid && pedidoForm.get('fecha_cita')?.touched" class="p-error">
          La fecha de la cita del pedido es requerida.
        </small>
        <p-skeleton *ngIf="loading" height="2.5rem" styleClass="w-full" />
      </div>

      <p-button class="self-center" type="submit" label="Enviar" [disabled]="pedidoForm.invalid" />
    </div>
  </form>
