<div class="card flex flex-col items-center">
  <div [hidden]="loading">

    <div class="flex flex-col item?-center justify-center my-5 gap-3">
      <div class="row-span-2 flex justify-center gap-7">
        <div class="flex flex-col">
          <h1 class="text-2xl font-semibold w-[13rem]">{{ item?.nombre }}</h1>
          <span class="font-bold">{{ item?.precio }}</span>
        </div>
        <span class="font-bold text-xl">{{ item?.categoria_nombre }}</span>
      </div>
      <div class="w-[20rem] h-[2q5rem] item?-center justify-center flex flex-col gap-5">
        <img class="object-cover shadow-lg border rounded-lg" [src]="item?.imagen_url" alt="{{ item?.nombre }}"
          alt="detalle producto imagen">
        <div class="flex justify-center w-full">
          <p-rating [style]="{'--p-rating-icon-size': '15px'}" [ngModel]="item?.calificacion" [readonly]="true" />
        </div>
      </div>
    </div>
    <div class="w-full flex justify-center text-justify">
      <p class="text-lg w-[20rem]">{{ item?.descripcion }}</p>
    </div>


    <div class="flex justify-center mt-7">
      <p-button pButton label="Añadir al carrito" class="w-50" />
    </div>
  </div>

  <div [hidden]="!loading">
    <i class="pi pi-spin pi-spinner"></i>
  </div>
</div>
