<div class="py-5 px-8 flex flex-col items-center gap-14">
  <div class="flex flex-col items-center w-[18rem]">
    <span class=" text-center text-4xl font-bold">Bs. {{totalBolivares}}</span>
    <span class="text-md">Total dolares: {{totalDolar | currency}}</span>
    <span class="text-md">Dolar hoy: {{dolar | currency}}</span>
  </div>

  <div class="flex w-full">
    <div class="relative bg-gray-400 h-[3px] w-full rounded-3xl">
      <span class="absolute px-3 top-[-13px] left-[5.2rem] bg-white text-lg font-semibold">Paga con PagoMovil</span>
    </div>
  </div>

  <form data-aos="fade-zoom-in" [formGroup]="movilForm" class="fluid w-full flex flex-col gap-3">
    <div class="field flex flex-col gap-1">
      <label class="text-lg" for="">Número de Teléfono</label>
      <input [readonly]="true" pInputText formControlName="telefono">
    </div>
    <div class="field flex flex-col gap-1">
      <label class="text-lg" for="">Cédula de Identidad</label>
      <p-inputnumber [min]="7000000" [max]="50000000" [readonly]="true" mode="decimal" type="text"
        formControlName="cedula" />
    </div>
    <div class="field flex flex-col gap-1">
      <label class="text-lg" for="">Banco</label>
      <p-select [readonly]="true" [options]="banklist" filter="true" formControlName="banco_num" />
    </div>
    <small>Los datos pueden ser cambiados en el <a class="border border-transparent border-b-black"
        routerLink="/usuarios/perfil">Perfil de
        Usuario.</a></small>
  </form>
  <div class="flex flex-col items-center justify-center gap-3">
    <p-button [disabled]="this.movilForm.invalid" label="Pagar ahora" (onClick)="onSubmit()" class="self-center" />
    <small class="text-red-700" *ngIf="this.movilForm.invalid">
      Los datos para realizar el pago no son correctos.
    </small>
  </div>

</div>
